name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Test conversions and queue behavior
        run: ./test.command
      - name: Build app
        run: ./build.command
